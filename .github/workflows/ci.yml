name: Verificação do protótipo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mapa-yggdrasil-v01]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript e compilar
        run: npm run build
