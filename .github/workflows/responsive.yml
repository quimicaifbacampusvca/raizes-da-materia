name: Responsividade e navegação multiplayer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    name: Playwright — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Compilar aplicativo
        run: npm run build
      - name: Testar dimensões, doca e painéis
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Preservar evidências e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
